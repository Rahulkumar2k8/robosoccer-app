name: Build ESP32 RC Wokwi Lab (Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Restore uploaded project ZIP
        run: |
          set -euo pipefail
          cat .github/source/archive.part*.b64 > /tmp/esp32_rc_wokwi_lab_android.zip
          unzip -tq /tmp/esp32_rc_wokwi_lab_android.zip
          mkdir -p .build-source
          unzip -q /tmp/esp32_rc_wokwi_lab_android.zip -d .build-source
          test -s .build-source/esp32_rc_wokwi_lab_android/package.json
          test -s .build-source/esp32_rc_wokwi_lab_android/www/index.html
          test -s .build-source/esp32_rc_wokwi_lab_android/capacitor.config.json
          echo "Restored supplied ESP32 RC Wokwi Lab Android project."

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor and generate Android project
        working-directory: .build-source/esp32_rc_wokwi_lab_android
        run: |
          npm install
          npx cap add android
          mkdir -p android/app/src/main/res/xml
          cp usb_otg/device_filter.xml android/app/src/main/res/xml/device_filter.xml
          npx cap sync android

      - name: Build Debug APK
        working-directory: .build-source/esp32_rc_wokwi_lab_android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_RC_Wokwi_Lab-Android-APK
          path: .build-source/esp32_rc_wokwi_lab_android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
