name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Project ZIP
        run: unzip RoboSoccer_RC_Lab_Android_Studio_Project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: RoboSoccer_Android_App
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboSoccer-Debug-APK
          path: RoboSoccer_Android_App/app/build/outputs/apk/debug/app-debug.apk
          
