name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Studio project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q RoboSoccer_RC_Lab_Android_Studio_Project.zip -d .
          echo "Extracted project files:"
          find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -print
          test -f RoboSoccer_Android_App/settings.gradle -o -f RoboSoccer_Android_App/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Ensure Android SDK licenses are accepted
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: RoboSoccer_Android_App
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboSoccer-Debug-APK
          path: RoboSoccer_Android_App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
